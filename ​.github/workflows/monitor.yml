name: BrewScope Market Monitor

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python scripts/monitor.py

      - name: Commit monitoring state
        run: |
          git config user.name "BrewScope Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update market monitor"
          git push
